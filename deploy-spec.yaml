app: app-72d771c6ab53485d9b63
source:
  repo: https://github.com/jaedong29/anyship-demo-event-desk
  commit: d02d445e76383effefa413fe631a95a31f991c6a
build:
  dockerfile: Dockerfile
  runtime_hint: python3.12
port: 8080
healthcheck: /healthz
ingress: public
env:
- name: LOG_LEVEL
  secret: false
  generate: false
  value: INFO
- name: SECRET_KEY
  secret: true
  generate: true
backing_services: []
workload:
  type: request-driven
  scale_to_zero: true
  max_request_seconds: 10
  websocket: false
processes:
  web:
    instances: 1
profile: dev

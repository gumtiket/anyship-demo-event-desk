app: app-97ba6b561e1e48f096c4
source:
  repo: https://github.com/gumtiket/anyship-demo-event-desk
  commit: e02d7790fc47c973022caa23c72e0316a0f11238
build:
  dockerfile: Dockerfile
  runtime_hint: python3.12
port: 8080
healthcheck: /healthz
ingress: public
env:
- name: LOG_LEVEL
  secret: false
  generate: false
  value: INFO
- name: SECRET_KEY
  secret: true
  generate: true
backing_services:
- type: postgres
  bind_as: DATABASE_URL
workload:
  type: request-driven
  scale_to_zero: true
  max_request_seconds: 10
  websocket: false
processes:
  web:
    instances: 1
release:
  migrate: python -m app.migrate
profile: dev
